name: Check Submission

on:
  pull_request_target:
    types: [opened, edited, synchronize, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Post-merge welcome comment
  welcome:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- welcome-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });

            if (!comments.some(c => c.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${marker}\nThank you for your contribution! Your server has been merged.

            Are you in the MCP [Discord](https://glama.ai/mcp/discord)? Let me know your Discord username and I will give you a **server-author** flair.`
              });
            }

  # Validation checks (only on open PRs)
  check-submission:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out the BASE branch, never PR-authored code. Do not change this
      # to check out the head ref: this workflow runs with write permissions.
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate PR submission
        uses: actions/github-script@v7
        with:
          script: |
            const validateSubmission = require('./scripts/validate-submission.cjs');
            await validateSubmission({ github, context });
